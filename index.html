<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Moon Studios Dev | Portfolio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #EFECE6;
            --glass-bg: rgba(250, 249, 246, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-highlight: rgba(255, 255, 255, 0.9);
            --glass-shadow: 0 10px 40px -10px rgba(44, 44, 44, 0.08);
            
            --text-dark: #2C2C2C;
            --text-muted: #6B6B6B;
            --accent-taupe: #8A735B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 10% 0%, rgba(255, 255, 255, 0.8) 0px, transparent 50%),
                radial-gradient(at 90% 10%, rgba(230, 222, 208, 0.6) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(255, 255, 255, 0.7) 0px, transparent 50%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 5rem 2rem;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .handwritten-accent {
            font-family: 'Caveat', cursive;
            font-size: 2.2rem;
            color: var(--accent-taupe);
            transform: rotate(-3deg);
            display: inline-block;
            margin-bottom: -5px;
            opacity: 0.9;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 600;
            letter-spacing: -0.03em;
            color: var(--text-dark);
            margin-bottom: 1.2rem;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 550px;
            margin: 0 auto;
            line-height: 1.6;
            font-weight: 300;
        }

        .filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 4rem;
        }

        .filter-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 0.7rem 1.8rem;
            border-radius: 50px;
            color: var(--text-muted);
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            transition: all 0.4s ease;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            background: var(--glass-highlight);
            color: var(--text-dark);
        }

        .filter-btn.active {
            background: var(--text-dark);
            border-color: var(--text-dark);
            color: #FFFFFF;
            box-shadow: 0 8px 20px rgba(44, 44, 44, 0.15);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2.5rem;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 1.25rem;
            box-shadow: var(--glass-shadow);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(20px);
            animation: softFadeIn 0.8s forwards;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.6);
            border-color: #FFFFFF;
            box-shadow: 0 25px 50px -12px rgba(44, 44, 44, 0.1);
        }

        .card-img-wrapper {
            width: 100%;
            height: 240px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            position: relative;
            background: #DCD8D0; 
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover .card-img {
            transform: scale(1.04);
        }

        .card-badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(250, 249, 246, 0.9);
            backdrop-filter: blur(8px);
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-family: 'Caveat', cursive;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-taupe);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.8);
            z-index: 2;
        }

        .card-content {
            padding: 0 0.5rem 0.5rem;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
            letter-spacing: -0.01em;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            font-weight: 300;
        }

        @keyframes softFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .container { padding: 3rem 1.25rem; }
            .card { padding: 1rem; border-radius: 24px; }
            .card-img-wrapper { height: 200px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <span class="handwritten-accent">engineered & designed by</span>
            <h1>Blue Moon Studios Dev</h1>
            <p class="subtitle">A highly curated selection of pixel-perfect interfaces, robust full-stack systems, and optimized multiplayer environments.</p>
        </header>

        <nav class="filters" id="filters">
            <button class="filter-btn active" data-filter="all">The Collection</button>
            <button class="filter-btn" data-filter="fullstack">Applications</button>
            <button class="filter-btn" data-filter="games">Multiplayer</button>
            <button class="filter-btn" data-filter="frontend">Web Design</button>
        </nav>

        <main class="grid" id="portfolio-grid">
            </main>
    </div>

    <script>
        const projects = [
            // --- HEAVY ENGINEERING FIRST: Full-Stack & Systems ---
            {
                id: 6, type: 'fullstack', badge: 'Admin Dashboard', title: 'Enterprise Management Dashboard', img: 'bluemoon-portal.jpg',
                desc: 'Secure employee dashboard deployed with robust backend logic for managing complex client bookings and operations.'
            },
            {
                id: 7, type: 'fullstack', badge: 'Travel Logistics', title: 'Custom Travel Logistics System', img: 'chicago.jpg',
                desc: 'Comprehensive data management tool featuring daily briefings, group expense tracking, and interactive map logging.'
            },
            {
                id: 9, type: 'fullstack', badge: 'Client Portal', title: 'Secure Patient Intake Portal', img: 'massage.jpg',
                desc: 'Secure digital portal engineered for clientele to seamlessly manage appointments and update sensitive intake forms.'
            },
            {
                id: 8, type: 'fullstack', badge: 'Map Tech', title: 'Interactive Mapping Application', img: 'apex.jpg',
                desc: 'Geospatial mapping and management system dynamically connecting users with local physical facilities.'
            },

            // --- COMPLEX LOGIC: Multiplayer & Game States ---
            {
                id: 10, type: 'games', badge: 'Party Game', title: 'Real-Time Multiplayer App', img: 'imposter.jpg',
                desc: 'Custom social deduction game featuring automated QR code lobby instancing and synchronized live round management.'
            },
            {
                id: 11, type: 'games', badge: 'WebSockets', title: 'Browser-Based Party Game', img: 'witlash.jpg',
                desc: 'Interactive, low-latency multiplayer game allowing large lobbies to connect and compete via rapid data delivery.'
            },

            // --- THE VISUAL LAYER: UI/UX Front-End Sites ---
            {
                id: 1, type: 'frontend', badge: 'E-Commerce', title: 'Premium E-Commerce Platform', img: 'bluemoon-store.jpg', 
                desc: 'Modern retail showcase featuring highly optimized, elegant layouts tailored for product sales and digital downloads.'
            },
            {
                id: 2, type: 'frontend', badge: 'Landing Page', title: 'High-Conversion Landing Page', img: 'premium-flavor.jpg',
                desc: 'Aggressively optimized, single-page marketing architecture engineered specifically for B2B lead generation.'
            },
            {
                id: 3, type: 'frontend', badge: 'Brand Identity', title: 'Boutique Retail Website', img: 'sugarbliss.jpg',
                desc: 'Playful, vibrant user interface design for a local business, prioritizing brand identity and visual engagement.'
            },
            {
                id: 5, type: 'frontend', badge: 'Athletic UI', title: 'Fitness Studio Web Presence', img: 'koh-muay-thai.jpg',
                desc: 'Striking, action-oriented web design optimizing the user funnel directly toward class scheduling and trials.'
            },
            {
                id: 4, type: 'frontend', badge: 'Service Portal', title: 'Service Booking Website', img: 'nailstudio.jpg',
                desc: 'Warm and inviting web architecture highlighting local services and streamlining customer onboarding workflows.'
            },
            
            // --- EXPERIMENTAL / FUN STUFF AT THE BOTTOM ---
            {
                id: 12, type: 'fullstack', badge: 'Gamified Finance', title: 'Retro Personal Finance App', img: 'fire-tracker.jpg', 
                desc: 'A gamified Financial Independence (FIRE) budget tracker featuring a custom 8-bit retro UI, quest-based savings goals, and live terminal market integrations.'
            }
        ];

        const grid = document.getElementById('portfolio-grid');
        const filters = document.querySelectorAll('.filter-btn');

        function renderGrid(filterType = 'all') {
            grid.innerHTML = '';
            const filtered = filterType === 'all' ? projects : projects.filter(p => p.type === filterType);

            filtered.forEach((item, index) => {
                const delay = index * 0.06;
                const html = `
                    <div class="card" style="animation-delay: ${delay}s">
                        <div class="card-img-wrapper">
                            <span class="card-badge">${item.badge}</span>
                            <img src="${item.img}" alt="${item.title}" class="card-img" 
                                 onerror="this.style.display='none';">
                        </div>
                        <div class="card-content">
                            <h3 class="card-title">${item.title}</h3>
                            <p class="card-desc">${item.desc}</p>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', html);
            });
        }

        renderGrid();

        filters.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filters.forEach(f => f.classList.remove('active'));
                e.target.classList.add('active');
                renderGrid(e.target.dataset.filter);
            });
        });
    </script>
</body>
</html>
